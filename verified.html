<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FundPulse — Email Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #070c18; --blue: #2360f5; --green: #00d47e;
      --white: #edf2ff; --muted: #7a8fb0;
    }
    html, body {
      height: 100%; background: var(--navy); color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 320px; }
    .logo {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 32px;
    }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); }
    .check-icon {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 24px;
      background: rgba(0,212,126,.12); border: 2px solid rgba(0,212,126,.3);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
      animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes pop { from{transform:scale(0.4);opacity:0;} to{transform:scale(1);opacity:1;} }
    h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -.025em; margin-bottom: 12px; }
    h1 span { color: var(--green); }
    p { font-size: .88rem; color: var(--muted); line-height: 1.7; margin-bottom: 28px; font-weight: 300; }
    .btn {
      display: inline-block; padding: 13px 28px; border-radius: 100px; border: none;
      background: var(--blue); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: .9rem; font-weight: 600; cursor: pointer; text-decoration: none;
      box-shadow: 0 0 24px rgba(35,96,245,.4); transition: all .25s;
    }
    .btn:hover { background: #4a7cff; transform: translateY(-1px); }
    .note { font-size: .72rem; color: var(--muted); margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="logo-dot"></span>FundPulse</div>
    <div class="check-icon">✓</div>
    <h1>Email <span>confirmed!</span></h1>
    <p id="msg">Your account is verified. Setting up your session…</p>
    <a class="btn" href="https://fundpulse-chi.vercel.app" id="continue-btn" style="display:none;">
      Open FundPulse →
    </a>
    <p class="note" id="note"></p>
  </div>

  <script>
    const SUPABASE_URL  = 'https://acwrtldncexhhlzutppv.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjd3J0bGRuY2V4aGhsenV0cHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNzQ4NzcsImV4cCI6MjA5Mzk1MDg3N30.DTojjCkw2xY-XQ_-AOai5VlKHsN98XBpgt8AalN4cj4';

    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = async () => {
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      // Supabase puts the session tokens in the URL hash
      // By just loading this page with the hash, Supabase SDK auto-processes it
      const { data: { session }, error } = await sb.auth.getSession();

      if (session) {
        // Session established on this device — store a verified flag in Supabase profile
        // so the laptop polling can detect it
        const name = session.user?.user_metadata?.full_name || 'there';

        // update profile to mark as verified — laptop polls this
        await sb.from('profiles').update({ full_name: name }).eq('id', session.user.id);

        document.getElementById('msg').textContent =
          'Your email is confirmed! You can now sign in — go back to FundPulse and reload the page, or open it on this device.';
        document.getElementById('continue-btn').style.display = 'inline-block';
        document.getElementById('note').textContent =
          'Confirmed on a different device? Just reload the sign-up page and sign in with your email and password.';
      } else {
        document.getElementById('msg').textContent =
          'Email confirmed! Reload the sign-up page to sign in, or open FundPulse directly on this device.';
        document.getElementById('continue-btn').style.display = 'inline-block';
      }
    };
    document.head.appendChild(s);
  </script>
</body>
</html>
