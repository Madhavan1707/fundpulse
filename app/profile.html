<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#070c18"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg"/>
  <title>FundPulse — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
  <script src="supabase.js"></script>
  <style>
    @view-transition { navigation: auto; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #070c18; --navy-2: #0b1220; --navy-3: #0f1a2e; --navy-4: #142038;
      --blue: #2360f5; --blue-light: #4a7cff;
      --green: #00d47e; --red: #ff4060;
      --white: #edf2ff; --muted: #7a8fb0; --muted-2: #4a5878;
      --card: rgba(255,255,255,0.04); --cb: rgba(255,255,255,0.08);
    }
    html, body { height: 100%; }
    body { background: var(--navy); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 400; -webkit-font-smoothing: antialiased; overflow: hidden; }

    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; border-bottom: 1px solid var(--cb); background: rgba(7,12,24,0.96); backdrop-filter: blur(20px); flex-shrink: 0; position: relative; z-index: 10; }
    .app-logo { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; color: var(--white); text-decoration: none; }
    .logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); animation: dp 2.2s ease-in-out infinite; }
    @keyframes dp { 0%,100%{box-shadow:0 0 6px var(--blue);}50%{box-shadow:0 0 14px var(--blue),0 0 28px rgba(35,96,245,.6);} }
    .header-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #0a1f5c); border: 1.5px solid rgba(35,96,245,.4); display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: .78rem; color: var(--white); cursor: pointer; }

    .bottom-nav { display: flex; align-items: center; background: rgba(11,18,32,0.97); border-top: 1px solid var(--cb); backdrop-filter: blur(20px); flex-shrink: 0; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 8px; gap: 4px; cursor: pointer; transition: all .2s; border: none; background: none; color: var(--muted-2); font-family: 'Plus Jakarta Sans', sans-serif; }
    .nav-icon { font-size: 1.15rem; line-height: 1; }
    .nav-label { font-size: .6rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--blue); margin-top: 2px; opacity: 0; }

    .profile-body { flex: 1; overflow-y: auto; padding: 28px 16px 24px; }
    .profile-body::-webkit-scrollbar { width: 3px; }
    .profile-body::-webkit-scrollbar-thumb { background: var(--navy-4); border-radius: 3px; }

    .profile-avatar-wrap { display: flex; justify-content: center; margin-bottom: 24px; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #0a1f5c); border: 2.5px solid rgba(35,96,245,.4); display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.8rem; color: var(--white); }

    .settings-section { margin-bottom: 24px; }
    .settings-section-label { display: block; font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; padding: 0 4px; }
    .settings-card { background: var(--navy-3); border: 1px solid var(--cb); border-radius: 14px; overflow: hidden; }
    .settings-sep { height: 1px; background: var(--cb); margin: 0 16px; }

    .field-row { padding: 14px 16px; }
    .field-label { display: block; font-size: .65rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 6px; }
    .field-input { width: 100%; background: transparent; border: none; outline: none; color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; font-size: .92rem; font-weight: 500; padding: 0; }
    .field-input::placeholder { color: var(--muted-2); }
    .field-readonly { color: var(--muted); cursor: default; }

    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
    .settings-row-btn { cursor: pointer; transition: background .18s; }
    .settings-row-btn:hover { background: rgba(255,255,255,.04); }
    .settings-row-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    .settings-row-icon { font-size: 1.1rem; flex-shrink: 0; }
    .settings-row-title { font-size: .88rem; font-weight: 500; color: var(--white); margin-bottom: 2px; }
    .settings-row-sub { font-size: .72rem; color: var(--muted); line-height: 1.4; }
    .settings-chevron { color: var(--muted-2); font-size: 1.1rem; flex-shrink: 0; }

    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--navy-3); border: 1px solid var(--cb); border-radius: 100px; padding: 10px 20px; font-size: .78rem; color: var(--white); z-index: 800; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
    .toast.show { opacity: 1; }

    @media(min-width: 520px) {
      .screen { max-width: 480px; left: 50%; transform: translateX(-50%); right: auto; }
    }
    /* desktop: wider column, nav docked under the header */
    @media(min-width: 900px) {
      .screen { max-width: 680px; border-left: 1px solid var(--cb); border-right: 1px solid var(--cb); }
      .app-header { order: -2; }
      .bottom-nav { order: -1; justify-content: center; border-top: none; border-bottom: 1px solid var(--cb); }
      .nav-item { flex: 0 0 auto; flex-direction: row; gap: 7px; padding: 13px 22px; }
      .nav-item.active { box-shadow: inset 0 -2px 0 var(--blue); }
      .nav-label { font-size: .72rem; }
      .nav-dot { display: none; }
    }
  </style>
</head>
<body>

<div class="screen" id="screen-profile">
  <div class="app-header">
    <a class="app-logo" href="#"><span class="logo-dot"></span>FundPulse</a>
    <div class="header-avatar" id="header-avatar" onclick="openProfileDrawer()">M</div>
  </div>

  <div class="profile-body">

    <div class="profile-avatar-wrap">
      <div class="profile-avatar" id="profile-avatar">M</div>
    </div>

    <div class="settings-section">
      <span class="settings-section-label">Your info</span>
      <div class="settings-card">
        <div class="field-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="flex:1;min-width:0;">
            <label class="field-label" for="name-input">Display name</label>
            <input type="text" class="field-input field-readonly" id="name-input" placeholder="Your name" readonly tabindex="-1">
          </div>
          <button id="name-edit-btn" onclick="startEditName()" style="flex-shrink:0;background:transparent;border:1px solid var(--cb);border-radius:8px;color:var(--blue);font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;font-weight:600;padding:5px 12px;cursor:pointer;">Edit</button>
        </div>
        <div class="settings-sep"></div>
        <div class="field-row">
          <label class="field-label" for="email-input">Email address</label>
          <input type="email" class="field-input field-readonly" id="email-input" readonly tabindex="-1">
        </div>
      </div>
    </div>

    <div class="settings-section">
      <span class="settings-section-label">Account</span>
      <div class="settings-card">
        <div class="settings-row settings-row-btn" onclick="sendPasswordReset()">
          <div class="settings-row-left">
            <span class="settings-row-icon">🔑</span>
            <div>
              <div class="settings-row-title">Change password</div>
              <div class="settings-row-sub">We'll email you a reset link</div>
            </div>
          </div>
          <span class="settings-chevron">›</span>
        </div>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item" onclick="switchTab('feed')">
      <span class="nav-icon">📰</span><span class="nav-label">Feed</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="switchTab('alerts')">
      <span class="nav-icon">🔔</span><span class="nav-label">Alerts</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="switchTab('watchlist')">
      <span class="nav-icon">📋</span><span class="nav-label">Watchlist</span><span class="nav-dot"></span>
    </button>
    <button class="nav-item" onclick="switchTab('settings')">
      <span class="nav-icon">⚙️</span><span class="nav-label">Settings</span><span class="nav-dot"></span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration || 1500);
}

function startEditName() {
  const inp = document.getElementById('name-input');
  const btn = document.getElementById('name-edit-btn');
  inp.removeAttribute('readonly');
  inp.removeAttribute('tabindex');
  inp.classList.remove('field-readonly');
  inp.focus();
  btn.textContent = 'Save';
  btn.onclick = saveName;
}

async function saveName() {
  const inp  = document.getElementById('name-input');
  const btn  = document.getElementById('name-edit-btn');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  inp.setAttribute('readonly', '');
  inp.setAttribute('tabindex', '-1');
  inp.classList.add('field-readonly');
  btn.textContent = 'Edit';
  btn.onclick = startEditName;
  localStorage.setItem('fp_username', name);
  document.getElementById('profile-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('header-avatar').textContent  = name.charAt(0).toUpperCase();
  await saveProfileName(name);
  showToast('Saved');
}

async function sendPasswordReset() {
  const email = localStorage.getItem('fp_email');
  if (!email) { showToast('Email not found — try logging out and back in'); return; }
  const { error } = await window._supabase.auth.resetPasswordForEmail(email);
  if (error) { showToast('Could not send reset email'); return; }
  showToast('Reset link sent to your email', 2500);
}

function switchTab(tab) {
  const paths = { feed: 'feed.html', alerts: 'alerts.html', watchlist: 'watchlist.html', settings: 'settings.html' };
  window.location.href = paths[tab];
}

// render immediately from localStorage — runs at parse time so navigating
// here never flashes empty fields while the auth SDK loads
(function instantRender() {
  const name  = localStorage.getItem('fp_username') || '';
  const email = localStorage.getItem('fp_email')    || '';
  document.getElementById('name-input').value   = name;
  document.getElementById('email-input').value  = email;
  const initial = name.charAt(0).toUpperCase() || '?';
  document.getElementById('profile-avatar').textContent = initial;
  document.getElementById('header-avatar').textContent  = initial;
  initProfileDrawer();
})();

async function boot() {
  const session = await getSession();
  if (!session) { window.location.href = '../index.html'; return; }

  const name = localStorage.getItem('fp_username') || '';
  const profile = await fetchProfile();
  if (profile?.full_name && profile.full_name !== name) {
    localStorage.setItem('fp_username', profile.full_name);
    document.getElementById('name-input').value   = profile.full_name;
    document.getElementById('profile-avatar').textContent = profile.full_name.charAt(0).toUpperCase();
    document.getElementById('header-avatar').textContent  = profile.full_name.charAt(0).toUpperCase();
  }
}

window.addEventListener('supabase_ready', boot, { once: true });
if (window._supabase) setTimeout(boot, 0);
</script>
</body>
</html>
