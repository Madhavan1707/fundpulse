<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FundPulse — Email Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #070c18; --blue: #2360f5; --green: #00d47e;
      --white: #edf2ff; --muted: #7a8fb0;
    }
    html, body {
      height: 100%; background: var(--navy); color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 320px; }
    .logo {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 32px;
    }
    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--blue);
      box-shadow: 0 0 10px var(--blue);
    }
    .check-icon {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 24px;
      background: rgba(0,212,126,.12); border: 2px solid rgba(0,212,126,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      animation: pop .5s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes pop { from{transform:scale(0.4);opacity:0;} to{transform:scale(1);opacity:1;} }
    h1 {
      font-family: 'Outfit', sans-serif; font-weight: 800;
      font-size: 1.6rem; letter-spacing: -.025em; margin-bottom: 12px;
    }
    h1 span { color: var(--green); }
    p { font-size: .88rem; color: var(--muted); line-height: 1.7; margin-bottom: 28px; font-weight: 300; }
    .note {
      font-size: .75rem; color: var(--muted);
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 12px 16px; line-height: 1.6;
    }
    .note b { color: var(--white); font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="logo-dot"></span>FundPulse</div>
    <div class="check-icon">✓</div>
    <h1>Email <span>confirmed!</span></h1>
    <p>Your account is verified and ready. Go back to the tab or device where you signed up — it will move forward automatically.</p>
    <div class="note">
      <b>Already on this device?</b> You can close this tab and return to FundPulse, or open <b>fundpulse-chi.vercel.app</b> directly.
    </div>
  </div>
</body>
</html>
