name: Alert Engine

on:
  schedule:
    # 21:30, 22:30 and 23:30 IST. Three slots, not one, because GitHub delays
    # scheduled runs under load (observed +36m to +8h34m on this repo), and a
    # single daily slot means one delayed or failed run drops that day's alerts
    # for good. alert_log dedups on (user, fund, type, nav_date), so whichever
    # run first sees a new NAV sends and the rest are no-ops.
    # Avoids :00/:30 on the hour where GitHub's queue is most congested.
    - cron: '5 16 * * *'
    - cron: '5 17 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:        # manual trigger for testing

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run alert engine
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY:             ${{ secrets.BREVO_API_KEY }}
          ALERT_FROM_EMAIL:          ${{ secrets.ALERT_FROM_EMAIL }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL:         ${{ secrets.RESEND_FROM_EMAIL }}
          APP_URL:                   ${{ secrets.APP_URL }}
          VAPID_PUBLIC_KEY:          ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:         ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:             ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/alert-engine.js
